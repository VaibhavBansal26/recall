<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Recall is offline</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        font: 16px/1.5 system-ui, sans-serif; background: #fff; color: #171717;
      }
      @media (prefers-color-scheme: dark) { body { background: #0a0a0a; color: #f5f5f5; } }
      main { max-width: 22rem; padding: 1.5rem; text-align: center; }
      button {
        margin-top: 1rem; padding: 0.75rem 1.25rem; font-size: 1rem; border: 0;
        border-radius: 0.5rem; background: #4f46e5; color: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Recall keeps your notes on your server, so it needs a connection. Your notes are safe.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
