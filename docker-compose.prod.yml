name: recall-prod

# Production stack for a single cloud VM. Only Caddy publishes ports (80/443).
# Usage: cp .env.prod.example .env && edit it, then
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS, e.g. recall.example.com}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-recall}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recall} -d ${POSTGRES_DB:-recall}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-recall}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-recall}
      CORS_ORIGINS: '["${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN, e.g. https://recall.example.com}"]'
    # Migrate, then serve (no --reload). Only Caddy can reach this port, so trusting its
    # forwarded headers is safe and gives the login rate limiter the real client address.
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    depends_on:
      - backend

  # Optional (Phase 4): `docker compose -f docker-compose.prod.yml --profile n8n up -d`.
  # Not published; reach the UI through an SSH tunnel: ssh -L 5678:localhost:5678 vm
  n8n:
    image: n8nio/n8n:latest
    profiles: ["n8n"]
    restart: unless-stopped
    environment:
      RECALL_BACKEND_URL: http://backend:8000
      RECALL_SHARED_SECRET: ${RECALL_SHARED_SECRET:-change-me}
      GENERIC_TIMEZONE: ${TZ:-UTC}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  n8n_data:
