# On every push to main: build the images here (GitHub's runners have the memory), push them to GHCR,
# then SSH to the VM, which only pulls and restarts. Lets a 1 GB Droplet run the app.
# Setup: see DEPLOY.md, "Automatic deploys".
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits instead of racing the running one.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  BACKEND_IMAGE: ghcr.io/vaibhavbansal26/recall-backend
  FRONTEND_IMAGE: ghcr.io/vaibhavbansal26/recall-frontend

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: prod
          build-args: NEXT_PUBLIC_API_URL=
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Pull the new images and restart
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          TAG: ${{ github.sha }}
        run: |
          # The short-lived job token goes in over stdin so it works for private packages and is
          # never written to the server's disk beyond docker's own login cache.
          printf '%s' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
            "$USER_NAME@$HOST" "set -e
              docker login ghcr.io -u '$REGISTRY_USER' --password-stdin
              cd ~/recall
              git fetch origin main && git reset --hard origin/main
              export IMAGE_TAG='$TAG'
              docker compose -f docker-compose.prod.yml pull backend frontend
              docker compose -f docker-compose.prod.yml up -d --no-build
              docker logout ghcr.io
              docker image prune -f"

      - name: Wait for the app
        env:
          SITE: ${{ secrets.DEPLOY_SITE }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://$SITE/healthz"; then echo; exit 0; fi
            sleep 5
          done
          echo "healthz did not come up after the deploy" >&2
          exit 1
